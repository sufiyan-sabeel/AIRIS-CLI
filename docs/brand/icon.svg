<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="ig" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#0088ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
    <radialGradient id="gg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0066ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="gl" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="200" height="200" fill="#000000"/>
  <circle cx="100" cy="100" r="95" fill="url(#gg)"/>

  <!-- Rings -->
  <g opacity="0.55">
    <ellipse cx="100" cy="100" rx="88" ry="24" transform="rotate(-30 100 100)" fill="none" stroke="url(#ig)" stroke-width="1.2" stroke-dasharray="80 8"/>
    <ellipse cx="100" cy="100" rx="88" ry="24" transform="rotate(30 100 100)" fill="none" stroke="url(#ig)" stroke-width="1.2" stroke-dasharray="60 7"/>
    <ellipse cx="100" cy="100" rx="28" ry="88" transform="rotate(90 100 100)" fill="none" stroke="url(#ig)" stroke-width="1.2" stroke-dasharray="90 6"/>
  </g>

  <!-- A shape -->
  <line x1="71" y1="178" x2="98" y2="36" stroke="url(#ig)" stroke-width="9" stroke-linecap="round"/>
  <line x1="129" y1="178" x2="102" y2="36" stroke="url(#ig)" stroke-width="9" stroke-linecap="round"/>

  <!-- Crossbar segments -->
  <line x1="77" y1="122" x2="98" y2="122" stroke="url(#ig)" stroke-width="7" stroke-linecap="round"/>
  <line x1="102" y1="122" x2="123" y2="122" stroke="url(#ig)" stroke-width="7" stroke-linecap="round"/>

  <!-- Center node -->
  <circle cx="100" cy="122" r="3.5" fill="#00e5ff" filter="url(#gl)"/>
  <circle cx="100" cy="122" r="1.5" fill="#fff" opacity="0.8"/>

  <!-- Apex gem -->
  <g filter="url(#gl)">
    <polygon points="100,23 109,38 100,53 91,38" fill="url(#ig)"/>
    <polygon points="100,27 105,38 100,49 95,38" fill="#fff" opacity="0.2"/>
  </g>

  <!-- Electrons -->
  <circle cx="165" cy="69" r="2" fill="#00e5ff" filter="url(#gl)" opacity="0.85"/>
  <circle cx="38" cy="145" r="2" fill="#00e5ff" filter="url(#gl)" opacity="0.85"/>
  <circle cx="100" cy="14" r="2" fill="#00e5ff" filter="url(#gl)" opacity="0.85"/>
</svg>
