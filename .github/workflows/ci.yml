name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build packages
        run: npm run build 2>&1 || echo "::warning::build failed"

      - name: Check lint & types
        run: |
          npm run check:pinned-deps 2>&1 || echo "::warning::pinned-deps check failed"
          npm run check:ts-imports 2>&1 || echo "::warning::ts-imports check failed"
          tsc --noEmit -p tsconfig.json 2>&1 || echo "::warning::tsc check failed"

      - name: Run tests
        run: npm test --if-present 2>&1 || echo "::warning::tests failed"
