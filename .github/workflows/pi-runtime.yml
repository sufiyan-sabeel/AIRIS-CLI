name: Pi Runtime

# Verifies the vendored upstream Pi runtime (vendor/pi) as an independent layer.
#
# It is a separate workflow because it is a separate tree with its own lockfile:
# AIRIS's `ci.yml` must not be slowed down or poisoned by 12 upstream workspaces,
# and this build needs more memory and network access than the integration
# sandbox provides (see docs/integration/AIRIS-PI-INTEGRATION-REPORT.md).
#
# Build order is the verified topological order from the upstream manifests:
#   telemetry -> schema -> chord -> tui -> codemode -> mcp -> ai
#   -> durable -> env -> agent -> coding-agent

on:
  # Runs on any branch that touches the vendored tree, so the integration branch
  # is verified before it is proposed for merge.
  push:
    paths:
      - 'vendor/pi/**'
      - 'integration/airis-runtime/**'
      - '.github/workflows/pi-runtime.yml'
  pull_request:
    branches: [main, remediation/baseline, ci/step-0-reliability]
    paths:
      - 'vendor/pi/**'
      - 'integration/airis-runtime/**'
      - '.github/workflows/pi-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-runtime:
    name: Build vendored Pi runtime
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: vendor/pi
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: vendor/pi/package-lock.json

      # The vendored tree carries upstream's own lockfile, so this is a true
      # reproduction of the pinned commit rather than a re-resolution.
      - name: Install vendored dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # packages/ai/src/providers/data is gitignored upstream and generated by a
      # network fetch; a fresh clone cannot build `ai` without this step.
      - name: Hydrate model data
        run: npm run hydrate:model-data

      - name: Build telemetry
        run: npm run build --workspace @earendil-works/pi-telemetry
      - name: Build schema
        run: npm run build --workspace @earendil-works/pi-schema
      - name: Build chord
        run: npm run build --workspace @earendil-works/chord
      - name: Build tui
        run: npm run build --workspace @earendil-works/pi-tui
      - name: Build codemode
        run: npm run build --workspace @earendil-works/pi-codemode
      - name: Build mcp
        run: npm run build --workspace @earendil-works/pi-mcp
      - name: Build ai
        run: npm run build --workspace @earendil-works/pi-ai
      - name: Build durable
        run: npm run build --workspace @earendil-works/pi-durable
      - name: Build env
        run: npm run build --workspace @earendil-works/pi-env
      - name: Build agent
        run: npm run build --workspace @earendil-works/pi-agent-core
      - name: Build coding-agent
        run: npm run build --workspace @earendil-works/pi-coding-agent

      # ---- AIRIS runtime adapter -------------------------------------------
      # Runs after the runtime build because the adapter's file: dependency
      # resolves to the built artifacts above.
      - name: Install adapter dependencies
        run: npm --prefix ../../integration/airis-runtime install --ignore-scripts --no-audit --no-fund

      - name: Typecheck adapter against real Pi declarations
        run: npm --prefix ../../integration/airis-runtime run typecheck

      - name: Adapter unit tests
        run: npm --prefix ../../integration/airis-runtime run test

      - name: Adapter integration tests (real Pi runtime)
        run: npm --prefix ../../integration/airis-runtime run test:integration

      # Deterministic end-to-end: real session, scripted faux provider with a
      # dummy runtime key, real tool-execution events, guard allow/deny.
      - name: Deterministic end-to-end (faux provider)
        run: npm --prefix ../../integration/airis-runtime run test:e2e

      # A directory can exist while being empty, so assert real emitted output.
      - name: Verify build output
        run: |
          set -euo pipefail
          fail=0
          for p in schema telemetry chord tui codemode mcp ai durable env agent coding-agent; do
            js=$(find "packages/$p/dist" -name '*.js' -type f 2>/dev/null | wc -l)
            dts=$(find "packages/$p/dist" -name '*.d.ts' -type f 2>/dev/null | wc -l)
            printf '%-14s js=%-5s d.ts=%-5s\n' "$p" "$js" "$dts"
            if [ "$js" -lt 1 ]; then
              echo "::error::packages/$p emitted no JavaScript"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "all 11 buildable packages emitted JavaScript"
