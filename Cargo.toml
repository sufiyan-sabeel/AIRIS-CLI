[workspace]
resolver = "3"
members = [
    "crates/airis-core",
    "crates/airis-config",
    "crates/airis-cache",
    "crates/airis-cli",
    "crates/airis-models",
    "crates/airis-providers",
    "crates/airis-agent",
    "crates/airis-planner",
    "crates/airis-tools",
    "crates/airis-memory",
    "crates/airis-workspace",
    "crates/airis-indexer",
    "crates/airis-editor",
    "crates/airis-terminal",
    "crates/airis-git",
    "crates/airis-lsp",
    "crates/airis-plugins",
    "crates/airis-mcp",
    "crates/airis-telemetry",
    "crates/airis-ui",
]
default-members = ["crates/airis-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "AIRIS-CLI: Next-generation AI coding assistant by KageOS"
homepage = "https://kageos.dev"
repository = "https://github.com/kageos/airis"

[workspace.dependencies]
# Async
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
async-recursion = "1.1"

# Concurrency
dashmap = "6.1"
parking_lot = "0.12"
rayon = "1.10"
flume = "0.11"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
toml = "0.8"
rmp-serde = "1.3"  # MessagePack for compact cache

# Error handling
anyhow = "1"
thiserror = "2"
color-eyre = "0.6"

# CLI & UI
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
ratatui = { version = "0.29", features = ["all-widgets"] }
crossterm = { version = "0.28", features = ["event-stream"] }
tui-textarea = "0.7"
syntect = { version = "5", features = ["default-fancy"] }
indicatif = "0.17"

# HTTP & networking
reqwest = { version = "0.12", features = ["json", "stream"] }
reqwest-eventsource = "0.6"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
headers = "0.4"

# Data structures
indexmap = { version = "2", features = ["serde"] }
priority-queue = "2"
lru = "0.12"
arc-swap = "1"
imbl = { version = "3", features = ["serde"] }
educe = "0.6"

# Text processing
regex = { version = "1", features = ["perf"] }
similar = { version = "2", features = ["inline", "text"] }
unicode-width = "0.2"
unicode-segmentation = "1"
chardetng = "0.1"
encoding_rs = "0.8"
tree-sitter = "0.25"

# Hashing & crypto
sha2 = "0.10"
blake3 = "1"
uuid = { version = "1", features = ["v4", "serde"] }

# Storage
sled = "0.34"
heed = { version = "0.20", default-features = false, features = ["lmdb"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# Filesystem
dunce = "1"
filetime = "0.2"
walkdir = "2"
ignore = "0.4"
globset = "0.4"
same-file = "1"
tempfile = "3"

# Editor/Diff
similar-asserts = "1"

# Terminal
termimad = "0.31"
shell-words = "1"
portable-pty = "0.9"
signal-hook = "0.3"
signal-hook-tokio = { version = "0.3", features = ["futures"] }
fd-lock = "4"

# Git
gix = { version = "0.69", default-features = false, features = ["blob-diff", "worktree-mutation", "status", "parallel"] }

# Vector search
instant-distance = "0.6"

# Compression
zstd = { version = "0.13", features = ["experimental"] }
flate2 = "1"
tar = "0.4"

# Logging/Audit
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
tracing-error = "0.2"

# Time
chrono = { version = "0.4", features = ["serde"] }
time = "0.3"

# Plugin/tooling
libloading = "0.8"
wasmtime = "28"

# Misc
dirs = "6"
once_cell = "1"
bitflags = "2"
petgraph = "0.6"
strsim = "0.11"

# Internal crates
airis-core = { path = "crates/airis-core" }
airis-config = { path = "crates/airis-config" }
airis-cache = { path = "crates/airis-cache" }
airis-cli = { path = "crates/airis-cli" }
airis-models = { path = "crates/airis-models" }
airis-providers = { path = "crates/airis-providers" }
airis-agent = { path = "crates/airis-agent" }
airis-planner = { path = "crates/airis-planner" }
airis-tools = { path = "crates/airis-tools" }
airis-memory = { path = "crates/airis-memory" }
airis-workspace = { path = "crates/airis-workspace" }
airis-indexer = { path = "crates/airis-indexer" }
airis-editor = { path = "crates/airis-editor" }
airis-terminal = { path = "crates/airis-terminal" }
airis-git = { path = "crates/airis-git" }
airis-lsp = { path = "crates/airis-lsp" }
airis-plugins = { path = "crates/airis-plugins" }
airis-mcp = { path = "crates/airis-mcp" }
airis-telemetry = { path = "crates/airis-telemetry" }
airis-ui = { path = "crates/airis-ui" }

[workspace.lints.rust]
unused_crate_dependencies = "warn"
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
module_name_repetitions = "allow"
module_inception = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
needless_pass_by_value = "allow"
must_use_candidate = "allow"
similar_names = "allow"
wildcard_imports = "allow"
enum_glob_use = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
implicit_hasher = "allow"
default_trait_access = "allow"
significant_drop_tightening = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 0
incremental = true
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
